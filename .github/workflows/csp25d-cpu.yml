name: CSP 2.5D synthetic CPU tests

on:
  push:
    branches:
      - feature/native-coronal-25d-baseline-20261120
  pull_request:

jobs:
  baseline-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy nibabel pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Validate code and synthetic NIfTI integration
        run: |
          python -m compileall -q scripts/csp25d_baseline.py scripts/audit_csp25d_manifest.py scripts/relocate_csp25d_manifest.py
          python -m pytest -q tests/test_csp25d_baseline.py tests/test_csp25d_integration.py
          python scripts/csp25d_baseline.py smoke
