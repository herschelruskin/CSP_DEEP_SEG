name: CSP 2.5D synthetic CPU tests

on:
  pull_request:
    paths:
      - 'scripts/csp25d_baseline.py'
      - 'scripts/audit_csp25d_manifest.py'
      - 'scripts/inventory_csp25d_crops.py'
      - 'scripts/overfit_csp25d_real.py'
      - 'scripts/reconcile_csp25d_manifest.py'
      - 'scripts/relocate_csp25d_manifest.py'
      - 'scripts/hpc/**'
      - 'tests/test_csp25d_baseline.py'
      - 'tests/test_csp25d_integration.py'
      - 'requirements-25d.txt'
      - '.github/workflows/csp25d-cpu.yml'
  workflow_dispatch:

jobs:
  baseline-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy nibabel pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Validate code and synthetic NIfTI integration
        run: |
          python -m compileall -q scripts/csp25d_baseline.py scripts/audit_csp25d_manifest.py scripts/inventory_csp25d_crops.py scripts/overfit_csp25d_real.py scripts/reconcile_csp25d_manifest.py scripts/relocate_csp25d_manifest.py
          bash -n scripts/hpc/train_csp25d.sbatch
          bash -n scripts/hpc/submit_csp25d_intensity_aug.sh
          python -m pytest -q tests/test_csp25d_baseline.py tests/test_csp25d_integration.py
          python scripts/csp25d_baseline.py smoke
